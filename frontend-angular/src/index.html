<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ferretool Vargas | Herramientas para avanzar</title>
    <meta
      name="description"
      content="Catálogo de herramientas y materiales de Ferretool Vargas en Mallasa, La Paz."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('fv-theme') || 'null');
          const dark = saved
            ? saved === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="brand/ftv-light.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
