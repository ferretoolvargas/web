version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend-angular
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "angular-eslint"
      tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "vitest"
          - "@playwright/test"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
