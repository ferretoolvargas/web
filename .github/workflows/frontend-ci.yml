name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend-angular/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend-angular/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend-angular

jobs:
  validate:
    name: Formato, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato
        run: npm run format:check

      - name: Ejecutar análisis estático
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm run test:ci

      - name: Generar build de producción
        run: npm run build

      - name: Instalar Chrome para Playwright
        run: npx playwright install --with-deps chrome

      - name: Ejecutar pruebas E2E
        run: npm run e2e

      - name: Guardar reporte E2E cuando falle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-angular/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar sitio para GitHub Pages
        run: npm run build:pages

      - name: Preparar fallback de rutas
        run: cp dist/ferretools-vargas/browser/index.html dist/ferretools-vargas/browser/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend-angular/dist/ferretools-vargas/browser

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
