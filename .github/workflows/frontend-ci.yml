name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend-angular/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend-angular/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend-angular

env:
  CI: true
  NODE_VERSION: 22

jobs:
  quality:
    name: Calidad (formato, lint, SEO, unitarias)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato
        run: npm run format:check

      - name: Ejecutar análisis estático
        run: npm run lint

      - name: Verificar sitemap
        run: npm run seo:check

      - name: Ejecutar pruebas unitarias
        run: npm run test:ci

  build:
    name: Build de producción
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar build de producción
        run: npm run build

  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chrome para Playwright
        run: npx playwright install --with-deps chrome

      - name: Ejecutar pruebas E2E
        run: npm run e2e

      - name: Guardar reporte E2E cuando falle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-angular/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: frontend-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://ferretoolvargas.github.io/web/

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar sitio para GitHub Pages
        run: npm run build:pages

      - name: Preparar fallback de rutas
        run: |
          cp dist/ferretools-vargas/browser/index.html dist/ferretools-vargas/browser/404.html
          touch dist/ferretools-vargas/browser/.nojekyll

      - name: Publicar rama gh-pages
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --track -b gh-pages /tmp/ferretool-pages origin/gh-pages
          rsync -a --delete --exclude=.git dist/ferretools-vargas/browser/ /tmp/ferretool-pages/
          cd /tmp/ferretool-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "deploy: publicar ${GITHUB_SHA}"
            git push origin gh-pages
          fi
